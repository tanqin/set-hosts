# Cargo 配置：Android 跨编译链接器
#
# - aarch64-linux-android 用 NDK 自带的 wrapper（NDK clang 配 lld），
#   避免 NDK clang 与 cargo 直接交互时 `lld: error: unknown argument` 的问题；
# - 其余 android target 使用同名 wrapper（NDK 已生成 21~35 各 API 级别）。
#
# 其它跨编译参数（NDK 根、API level 等）由 tauri-build / tauri 内部按需配置。
[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang.cmd"

[target.armv7-linux-androideabi]
linker = "armv7-linux-androideabi24-clang.cmd"

[target.i686-linux-android]
linker = "i686-linux-android24-clang.cmd"

[target.x86_64-linux-android]
linker = "x86_64-linux-android24-clang.cmd"